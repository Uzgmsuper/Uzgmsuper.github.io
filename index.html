<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>인덱스 - Semi-Realistic Human Creator (Extreme Edition)</title>
    <style>
        :root {
            --bg: #12100e;
            --pn: #1a1816;
            --tx: #f0ebe1;
            --mu: #a39b8f;
            --ac: #ff4500;
            --bd: #3a342e;
            color-scheme: dark;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: var(--pn);
            padding: 40px;
            border-radius: 20px;
            border: 2px dashed var(--ac);
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 0 30px rgba(255,69,0,0.2);
            animation: pulse 3s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); border-color: #ff4500; }
            100% { transform: scale(1.02); border-color: #00ffff; }
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
            color: var(--tx);
            letter-spacing: -0.5px;
        }
        p {
            color: var(--mu);
            font-size: 13.5px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            color: #fff;
            border: none;
            border-radius: 12px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(255,69,0,0.4);
            transition: transform 0.2s, filter 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💀 광기의 인체 개조 연구소 💀</h1>
        <p>평범한 비율은 개나 줘버렸습니다. 영혼까지 끌어모은 광기로 뒤틀린 인체 모델을 창조하고 GLB로 사출해 보세요[span_0](start_span)[span_0](end_span).</p>
        <a href="Semi-Realistic Human Creator.html" class="btn">🚀 지랄 맞은 크리에이터 폭주시키기</a>
    </div>
</body>
</html>
