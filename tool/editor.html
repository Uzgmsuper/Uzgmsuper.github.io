<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semi-Realistic Human Creator</title>
<style>
:root{--bg:#f4f1ec;--pn:#fff;--tx:#1d1b19;--mu:#7a746c;--ac:#c2623a;--bd:#e2ddd5;--v1:#efeae2;--v2:#d6cfc3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#141311;--pn:#1e1c1a;--tx:#ece8e2;--mu:#9a938a;--ac:#e08a5f;--bd:#34302b;--v1:#2c2925;--v2:#161412;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{height:100%;display:flex;flex-direction:column}
#view{position:relative;flex:0 0 44%;min-height:0;background:linear-gradient(var(--v1),var(--v2))}
canvas{width:100%;height:100%;display:block;touch-action:none}
#views{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
#info{position:absolute;right:10px;bottom:8px;color:var(--mu);font-size:12px}
#panels{flex:1;min-height:0;overflow:auto;background:var(--pn)}
aside{padding:12px 14px}
h3{margin:14px 0 8px;font-size:13px;color:var(--mu)}
#tabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.btn{padding:8px 11px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
#views .btn{padding:5px 9px;font-size:12px;opacity:.92}
.row{margin:9px 0}.row div{display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 0}
select{padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
#bGlb{width:100%}#st{margin-top:8px;color:var(--mu);font-size:12px;min-height:16px}
@media(min-width:900px){
#app{display:grid;grid-template-columns:300px 1fr 240px;grid-template-rows:minmax(0,1fr)}
#view{grid-column:2;grid-row:1;flex:none}
#panels{display:contents}
#left{grid-column:1;grid-row:1;overflow:auto;background:var(--pn);border-right:1px solid var(--bd)}
#right{grid-column:3;grid-row:1;overflow:auto;background:var(--pn);border-left:1px solid var(--bd)}}
.nm{display:inline-flex;align-items:center;gap:3px}
.nm input{width:64px;padding:3px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--pn);color:var(--tx);font:inherit;text-align:right}
.nm em{font-style:normal;color:var(--mu);font-size:12px;min-width:16px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
</style></head><body>
<div id="app">

<div class="row"><div><span>기본 피부색</span><input type="color" id="skin" value="#d9a98a"></div></div>

function applyQ(sh){const q=QP[QL.lvl]||QP[1];R.setPixelRatio(Math.min(3,q.pr*Math.max(devicePixelRatio||1,1)));rs();
 key.castShadow=q.ss>0;fl0.visible=q.ss>0;if(q.ss){key.shadow.mapSize.set(q.ss,q.ss);if(key.shadow.map){key.shadow.map.dispose();key.shadow.map=null}}
 if(sh)QL.hq=q.hq;hq(QL.hq);reHair();hairUI();dirty=true}
function qualUI(){const e=$('#qualUI');if(!e)return;e.innerHTML='<div class="row"><div><span>전체 품질</span><select>'+QP.map((q,i)=>'<option value="'+i+'">'+q.n+'</option>').join('')+'</select></div></div><div style="font-size:12px;color:var(--mu);margin:2px 0 6px">해상도·그림자·머리카락 정밀도가 함께 바뀌어요. 느리면 낮춰보세요.</div>';
 const sel=e.querySelector('select');sel.value=QL.lvl;sel.onchange=()=>{QL.lvl=+sel.value;applyQ(true)}}
function hairUI(){const e=$('#hairUI');if(!e)return;e.innerHTML='';const S=HS[HV.style],add=h=>{const r=document.createElement('div');r.className='row';r.innerHTML=h;e.append(r);return r};
 const r1=add('<div><span>스타일</span><select>'+Object.keys(HS).map(k=>'<option value="'+k+'">'+HS[k].n+'</option>').join('')+'</select></div>'),sel=r1.querySelector('select');sel.value=HV.style;sel.onchange=()=>hStyle(sel.value);
 const r2=add('<div><span>머리색</span><input type="color"></div>'),ci=r2.querySelector('input');ci.value=HV.color;ci.oninput=()=>{HV.color=ci.value;hdirty=true;hcol()};
 if(HV.style==='none')return;
 const sd=(l,k,mn,mx,f,u)=>mkRow(e,l,mn,mx,f===1?1:.01,HV[k],f,u,0,v=>{HV[k]=v;hdirty=true;hfill()});
 sd({pony:'꼬리 길이',bun:'번 크기'}[HV.style]||'머리 길이','len',1,{crew:15,part:40,bob:40,long:90,pony:70,bun:25}[HV.style],1,'cm');
 sd('볼륨','vol',.5,2.5,100,'%');sd('머리 뜨는 정도 (0 = 두피 밀착)','fit',0,1,100,'%');sd('앞머리 (이마 덮기)','bangs',0,1,100,'%');
 if(S.hang||HV.style==='pony')sd('웨이브','wave',0,1,100,'%');
 if(S.hang)sd('끝 안말이','curl',0,1,100,'%');sd('전체 커브 (C자 휘어짐)','curve',0,1,100,'%');if(S.hang||HV.style==='pony')sd('S 굴곡 (물결 커브)','scurve',0,1,100,'%');
 sd('광택 · 반사','gloss',.1,1,100,'%');sd('결 디테일 (올 명암·요철)','detail',0,1,100,'%');
 mkRow(e,'머리카락 정밀도 (메시 밀도)',.25,2,.05,QL.hq,100,'%',0,v=>{QL.hq=v;clearTimeout(qT);qT=setTimeout(()=>{hq(QL.hq);reHair()},180)});
 if(S.part){if(S.part===1){const r=add('<label class="chk"><input type="checkbox"> 가르마 넣기</label>'),cb=r.querySelector('input');cb.checked=!!HV.partOn;cb.onchange=()=>{HV.partOn=cb.checked?1:0;hdirty=true;hfill();hairUI()}}
  if(S.part===2||HV.partOn){const lb=()=>r.querySelector('span').textContent='가르마 (화면 왼쪽 기준) '+Math.round(HV.part*100)+':'+(100-Math.round(HV.part*100)),r=mkRow(e,'',.1,.9,.01,HV.part,100,'%',0,v=>{HV.part=v;hdirty=true;hfill();lb()});lb();const h=document.createElement('h3');h.textContent='가르마 · 앞머리 세부';e.append(h);sd('가르마 틈 (폭·진하기, 앞~뒤 전체)','gap',0,1,100,'%');sd('앞머리 휘어짐 (옆으로 흐름)','sweep',0,1,100,'%');sd('앞머리 C컬 갈라짐 (양옆 C자)','cbang',0,1,100,'%');sd('앞머리 띄움 (볼륨)','lift',0,1,100,'%')}}}

// ---------- 카메라 ----------
const fit=()=>Math.max(3.6,.95/(.315*cam.aspect));
function view(n,snap){const d=fit(),h=ht*.52;let p,t=[0,h,0];
 if(n==='face'){t=[0,ht-.13,0];p=[0,ht-.11,1.15]}
 else{const r={front:[0,.08,1],side:[1,.08,0],back:[0,.08,-1]}[n];p=[r[0]*d,h+r[1]*d,r[2]*d]}
 goal={p:new THREE.Vector3(...p),t:new THREE.Vector3(...t)};
 if(snap){cam.position.copy(goal.p);ctl.target.copy(goal.t);goal=null}}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const view$=$('#view');
const rs=()=>{const w=view$.clientWidth,h=view$.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};
new ResizeObserver(rs).observe(view$);

// ---------- UI ----------
function tabs(){const t=$('#tabs');t.innerHTML='';Object.keys(TABS).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className='btn'+(n===cur?' p':'');b.onclick=()=>{cur=n;tabs();sl()};t.append(b)})}
function sl(){const e=$('#sliders');e.innerHTML='';
 TABS[cur].forEach(([k,l])=>{const[mn,mx]=RG[k];mkRow(e,l,mn,mx,.01,V[k],100,'%',0,v=>{V[k]=v;dirty=true})})}
const st=t=>$('#st').textContent=t;
$('#skin').oninput=()=>{paint();hcol()};$('#iris').oninput=e=>{PC.iris=e.target.value;paint()};$('#irisR').onclick=()=>{delete PC.iris;paint()};$('#eref').oninput=applyEye;$('#bPaintReset').onclick=()=>{PC={};paint();st('부위 색을 초기화했어요')};
$('#rough').oninput=e=>skin.roughness=+e.target.value;
$('#light').onchange=e=>key.color.set([0xffffff,0xffddb8,0xc8dcff][+e.target.value]);
const setG=g=>{if(g!==GEN){GEN=g;build(g)}};
const PR={m:{g:'m',v:{fat:.85,muscle:1.1},c:'#2a1c14'},f:{g:'f',v:{hip:1.03},c:'#4a2c1c'},mm:{g:'m',v:{muscle:1.7,shoulder:1.12,chest:1.1,neck:1.15,fat:.5,build:1.05,bust:1.2},c:'#1c1410'},ff:{g:'f',v:{bust:1.6,hip:1.15,waist:.88,glute:1.5,fat:1.25,belly:.9},c:'#6a3a22'}};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=PR[b.dataset.p];V={...D,...p.v};setG(p.g);hair.color.set(p.c);$('#hc').value=p.c;HV.color=p.c;hdirty=false;hStyle(PR_HS[b.dataset.p],true);sl();dirty=true;st('프리셋을 적용했어요')});
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{setG(b.dataset.g);if(!hdirty)hStyle(b.dataset.g==='m'?'part':'long',true);dirty=true;st((b.dataset.g==='m'?'남성':'여성')+' 모델로 바꿨어요')});
$('#hc').oninput=e=>hair.color.set(e.target.value);
$('#bReset').onclick=()=>{V={...D};PC={};paint();sl();hdirty=false;hStyle(GEN==='m'?'part':'long',true);dirty=true;st('기본 체형으로 초기화했어요')};
$('#bRand').onclick=()=>{setG(Math.random()<.5?'m':'f');for(const k in V){const[a,b]=RG[k];V[k]=Math.min(b,Math.max(a,1+(Math.random()-.5)*.5))}sl();dirty=true;st('랜덤 체형을 만들었어요')};
$('#bSave').onclick=()=>{try{localStorage.setItem('shc2',JSON.stringify({V,GEN,PC,er:$('#eref').value,skin:$('#skin').value,hc:$('#hc').value,hv:HV,ql:QL}));st('설정을 저장했어요 (이 브라우저에 보관)')}catch(e){st('이 환경에서는 저장소를 쓸 수 없어요')}};
$('#bLoad').onclick=()=>{try{const d=JSON.parse(localStorage.getItem('shc2'));if(!d)throw 0;V={...D,...d.V};setG(d.GEN||'m');if(d.hc){hair.color.set(d.hc);$('#hc').value=d.hc}if(d.skin)$('#skin').value=d.skin;if(d.hv){Object.assign(HV,d.hv);hdirty=true;hairUI();hfill()}if(d.ql){Object.assign(QL,d.ql);qualUI();applyQ(false)}PC=d.PC||{};if(d.er){$('#eref').value=d.er;$('#eref').dispatchEvent(new Event('input'))}paint();sl();dirty=true;st('저장된 설정을 불러왔어요')}catch(e){st('저장된 설정이 없어요')}};

// ---------- GLB 내보내기 (저장 확장자 제한 때문에 zip 안에 human.glb) ----------
const T=new Uint32Array(256).map((_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0});
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(name,d){const n=new TextEncoder().encode(name),c=crc(d),o=new Uint8Array(30+n.length+d.length+46+n.length+22),v=new DataView(o.buffer);let p=0;
 const w4=x=>{v.setUint32(p,x,true);p+=4},w2=x=>{v.setUint16(p,x,true);p+=2};
 w4(0x04034b50);w2(20);w2(0);w2(0);w2(0);w2(0x21);w4(c);w4(d.length);w4(d.length);w2(n.length);w2(0);o.set(n,p);p+=n.length;o.set(d,p);p+=d.length;
 const cd=p;w4(0x02014b50);w2(20);w2(20);w2(0);w2(0);w2(0);w2(0x21);w4(c);w4(d.length);w4(d.length);w2(n.length);w2(0);w2(0);w2(0);w2(0);w4(0);w4(0);o.set(n,p);p+=n.length;
 w4(0x06054b50);w2(0);w2(0);w2(1);w2(1);w4(p-cd);w4(cd);w2(0);return o}
$('#bGlb').onclick=()=>{
 update(true);dirty=false;
 st('GLB 만드는 중…');
 new THREE.GLTFExporter().parse(G,async buf=>{
  let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  try{
   if(dl){await dl.save({filename:'semi-realistic-human.zip',data:zip('human.glb',new Uint8Array(buf))});st('저장 완료 · zip 안에 human.glb 가 들어 있어요')}
   else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'}));a.download='human.glb';a.click();st('human.glb 를 저장했어요')}
  }catch(e){st(e&&e.code==='declined'?'저장을 취소했어요':'저장 실패: '+((e&&e.message)||e))}
 },{binary:true});
};

// ---------- 시작 ----------
tabs();sl();qualUI();rs();applyQ(true);applyEye();bindNum($('#rough'),$('#roughN'),100,0);bindNum($('#eref'),$('#ervN'),100,0);build(GEN);deform();dirty=false;view('front',true);
(function loop(){requestAnimationFrame(loop);
 if(dirty){deform();dirty=false}
 if(goal){cam.position.lerp(goal.p,.12);ctl.target.lerp(goal.t,.12);if(cam.position.distanceTo(goal.p)<.01)goal=null}
 ctl.update();R.render(sc,cam)})();
})();
